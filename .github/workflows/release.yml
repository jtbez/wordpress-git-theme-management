# Publishes a GitHub Release when a version tag is pushed. Sites running the plugin
# find it through GDW_Updater (GitHub's /releases/latest) and offer the update.
#
#   git tag v1.2.2 && git push origin v1.2.2
name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLUG: wordpress-git-theme-management
    steps:
      - uses: actions/checkout@v4

      # The tag is the version: v1.3.0 or 1.3.0 (GDW_Updater ignores anything else).
      - name: Read version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.3.0"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The zip must unpack to $SLUG/ so WordPress replaces the installed plugin.
      # The Version header and GDW_VERSION are set from the tag inside the zip only.
      - name: Build zip
        run: |
          mkdir -p "build/$SLUG"
          git archive HEAD | tar -x -C "build/$SLUG"
          rm -rf "build/$SLUG/.github" "build/$SLUG/.gitignore" "build/$SLUG/.gitattributes"
          FILE="build/$SLUG/$SLUG.php"
          sed -i -E "s/^( \* Version:[[:space:]]*).*/\1$VERSION/" "$FILE"
          sed -i -E "s/^define\( 'GDW_VERSION', '[^']*' \)/define( 'GDW_VERSION', '$VERSION' )/" "$FILE"
          grep -E "^ \* Version:|^define\( 'GDW_VERSION'" "$FILE"
          if [ "$(grep -cF "$VERSION" "$FILE")" -lt 2 ]; then
            echo "::error::Could not set the version in $SLUG.php"
            exit 1
          fi
          (cd build && zip -qr "../$SLUG.zip" "$SLUG")
          unzip -l "$SLUG.zip"

      # A release made on github.com (Releases → Draft a new release) already exists,
      # so just attach the zip to it.
      - name: Create release or attach zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$SLUG.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$SLUG.zip" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
